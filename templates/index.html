<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Premium Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .form-heading {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="form-heading">Health Premium Calculator</h2>
        <form action="/predict" method="POST">

            <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" class="form-control" name="age" step="0.1" required>
            </div>

            <div class="mb-3">
                <label for="dependants" class="form-label">Number of Dependants</label>
                <input type="number" class="form-control" name="number_of_dependants" step="0.1" required>
            </div>

            <div class="mb-3">
                <label for="income" class="form-label">Income (in Lakhs)</label>
                <input type="number" class="form-control" name="income_lakhs" step="0.1" required>
            </div>

            <div class="mb-3">
                <label for="insurance_plan" class="form-label">Insurance Plan (numeric)</label>
                <input type="number" class="form-control" name="insurance_plan" step="0.1" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Select Diseases</label><br>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="diseases" value="diabetes">
                    <label class="form-check-label">Diabetes</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="diseases" value="heart disease">
                    <label class="form-check-label">Heart Disease</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="diseases" value="high blood pressure">
                    <label class="form-check-label">High Blood Pressure</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="diseases" value="thyroid">
                    <label class="form-check-label">Thyroid</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="diseases" value="no disease">
                    <label class="form-check-label">No Disease</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="gender" class="form-label">Gender</label>
                <select class="form-select" name="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="region" class="form-label">Region</label>
                <select class="form-select" name="region" required>
                    <option value="Northwest">Northwest</option>
                    <option value="Southeast">Southeast</option>
                    <option value="Southwest">Southwest</option>
                    <option value="Northeast">Northeast</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="marital_status" class="form-label">Marital Status</label>
                <select class="form-select" name="marital_status" required>
                    <option value="Unmarried">Unmarried</option>
                    <option value="Married">Married</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="bmi_category" class="form-label">BMI Category</label>
                <select class="form-select" name="bmi_category" required>
                    <option value="Obesity">Obesity</option>
                    <option value="Overweight">Overweight</option>
                    <option value="Underweight">Underweight</option>
                    <option value="Normal">Normal</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="smoking_status" class="form-label">Smoking Status</label>
                <select class="form-select" name="smoking_status" required>
                    <option value="Occasional">Occasional</option>
                    <option value="Regular">Regular</option>
                    <option value="Non-smoker">Non-smoker</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="employment_status" class="form-label">Employment Status</label>
                <select class="form-select" name="employment_status" required>
                    <option value="Salaried">Salaried</option>
                    <option value="Self-Employed">Self-Employed</option>
                    <option value="Unemployed">Unemployed</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Calculate Health Premium</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
